name: prospectiva2050

services:
  db:
    image: postgres:16-alpine
    container_name: hq2050-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hq2050}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hq2050_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hq2050}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hq2050} -d ${POSTGRES_DB:-hq2050}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
    container_name: hq2050-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hq2050}:${POSTGRES_PASSWORD:-hq2050_secret}@db:5432/${POSTGRES_DB:-hq2050}
      JWT_SECRET: ${JWT_SECRET:-secret_local_dev_no_usar_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    container_name: hq2050-web
    restart: unless-stopped
    environment:
      PORT: 3001
      PUBLIC_API_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      - api

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: hq2050-admin
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - api

volumes:
  pgdata: